<!-- templates/store/cart.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Shopping Cart – GenWrite Store</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ============================================
           RESET & BASE
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ============================================
           HEADER
           ============================================ */
        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #ffffff;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
            gap: 10px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header .logo {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header .logo .logo-icon {
            font-size: 22px;
        }
        .header .logo span {
            color: #fbbf24;
        }

        .header .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .header .btn-back {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 8px 14px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .header .btn-back:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ============================================
           CART PAGE
           ============================================ */
        .cart-page {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .cart-page .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .cart-page .page-header h1 {
            font-size: 28px;
            font-weight: 800;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-page .page-header h1 .badge {
            background: #6366f1;
            color: #fff;
            font-size: 14px;
            padding: 2px 14px;
            border-radius: 50px;
            font-weight: 600;
        }

        .cart-page .page-header .continue-shopping {
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .cart-page .page-header .continue-shopping:hover {
            color: #4f46e5;
            text-decoration: underline;
        }

        /* ============================================
           CART GRID
           ============================================ */
        .cart-grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
        }

        /* ============================================
           CART ITEMS LIST
           ============================================ */
        .cart-items-list {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
        }

        .cart-items-list .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }

        .cart-items-list .empty-cart .icon {
            font-size: 72px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .cart-items-list .empty-cart h3 {
            font-size: 22px;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .cart-items-list .empty-cart p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .cart-items-list .empty-cart .btn-shop {
            display: inline-block;
            padding: 12px 32px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .cart-items-list .empty-cart .btn-shop:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
        }

        /* ===== CART ITEM ===== */
        .cart-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid #f1f5f9;
            transition: all 0.3s ease;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item .item-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            flex-shrink: 0;
            background: #f8fafc;
        }

        .cart-item .item-details {
            flex: 1;
            min-width: 0;
        }

        .cart-item .item-details .item-name {
            font-weight: 700;
            color: #0f172a;
            font-size: 16px;
            margin-bottom: 2px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .cart-item .item-details .item-sku {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .cart-item .item-details .item-price {
            font-weight: 700;
            color: #2563eb;
            font-size: 17px;
        }

        .cart-item .item-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-item .item-actions .qty-control {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }

        .cart-item .item-actions .qty-control button {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            color: #1e293b;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-item .item-actions .qty-control button:hover {
            background: #e2e8f0;
        }

        .cart-item .item-actions .qty-control .qty-value {
            min-width: 30px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            color: #0f172a;
        }

        .cart-item .item-actions .item-total {
            font-weight: 700;
            color: #6366f1;
            font-size: 17px;
            min-width: 80px;
            text-align: right;
        }

        .cart-item .item-actions .btn-remove {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 18px;
            padding: 6px 8px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .cart-item .item-actions .btn-remove:hover {
            color: #dc2626;
            background: #fef2f2;
        }

        /* ============================================
           CART SUMMARY (SIDEBAR)
           ============================================ */
        .cart-summary-sidebar {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
            position: sticky;
            top: 90px;
            height: fit-content;
        }

        .cart-summary-sidebar h3 {
            font-size: 18px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }

        .cart-summary-sidebar .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
            color: #475569;
        }

        .cart-summary-sidebar .summary-row.total {
            border-top: 2px solid #e2e8f0;
            margin-top: 8px;
            padding-top: 16px;
            font-size: 20px;
            font-weight: 800;
            color: #0f172a;
        }

        .cart-summary-sidebar .summary-row.total .amount {
            color: #2563eb;
        }

        .cart-summary-sidebar .summary-row .label {
            font-weight: 500;
        }

        .cart-summary-sidebar .summary-row .value {
            font-weight: 600;
        }

        .cart-summary-sidebar .btn-checkout {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .cart-summary-sidebar .btn-checkout:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
        }

        .cart-summary-sidebar .btn-checkout:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .cart-summary-sidebar .btn-clear-cart {
            width: 100%;
            padding: 10px;
            background: none;
            color: #64748b;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .cart-summary-sidebar .btn-clear-cart:hover {
            background: #fef2f2;
            border-color: #dc2626;
            color: #dc2626;
        }

        /* ============================================
           NOTIFICATION
           ============================================ */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            z-index: 9999;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            max-width: 90%;
            font-size: 14px;
            text-align: center;
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* ============================================
           LOADER
           ============================================ */
        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .loader .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 992px) {
            .cart-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .cart-summary-sidebar {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .cart-page .page-header h1 {
                font-size: 22px;
            }

            .cart-items-list {
                padding: 16px;
            }

            .cart-item {
                flex-wrap: wrap;
                gap: 12px;
                padding: 14px 0;
            }

            .cart-item .item-image {
                width: 60px;
                height: 60px;
            }

            .cart-item .item-details .item-name {
                font-size: 14px;
            }

            .cart-item .item-details .item-price {
                font-size: 15px;
            }

            .cart-item .item-actions {
                flex-wrap: wrap;
                width: 100%;
                justify-content: space-between;
            }

            .cart-item .item-actions .item-total {
                min-width: auto;
                font-size: 15px;
            }

            .cart-summary-sidebar {
                padding: 18px;
            }

            .cart-summary-sidebar .summary-row.total {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .header .logo {
                font-size: 15px;
            }
            .header .btn-back {
                font-size: 11px;
                padding: 6px 10px;
            }

            .cart-page {
                padding: 0 12px;
                margin: 16px auto;
            }

            .cart-page .page-header h1 {
                font-size: 18px;
            }
            .cart-page .page-header h1 .badge {
                font-size: 12px;
                padding: 1px 10px;
            }

            .cart-items-list {
                padding: 12px;
            }

            .cart-item .item-image {
                width: 50px;
                height: 50px;
            }

            .cart-item .item-details .item-name {
                font-size: 13px;
            }
            .cart-item .item-details .item-price {
                font-size: 14px;
            }

            .cart-item .item-actions .qty-control button {
                width: 28px;
                height: 28px;
                font-size: 14px;
            }
            .cart-item .item-actions .qty-control .qty-value {
                min-width: 24px;
                font-size: 13px;
            }

            .cart-item .item-actions .item-total {
                font-size: 14px;
            }

            .cart-summary-sidebar h3 {
                font-size: 16px;
            }
            .cart-summary-sidebar .summary-row.total {
                font-size: 16px;
            }
            .cart-summary-sidebar .btn-checkout {
                font-size: 14px;
                padding: 12px;
            }
        }

        /* Landscape Phones */
        @media (max-height: 600px) and (orientation: landscape) {
            .cart-page {
                margin: 12px auto;
            }
            .cart-item .item-image {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================
    HEADER
    ============================================ -->
    <header class="header">
        <div class="logo">
            <span class="logo-icon">🛍️</span>
            <span>GenWrite</span> <span>Store</span>
        </div>
        <div class="header-actions">
            <a href="/products/" class="btn-back">
                <i class="fas fa-arrow-left"></i> Continue Shopping
            </a>
        </div>
    </header>

    <!-- ============================================
    CART PAGE
    ============================================ -->
    <div class="cart-page">

        <!-- Page Header -->
        <div class="page-header">
            <h1>
                <i class="fas fa-shopping-cart" style="color:#6366f1;"></i>
                Your Cart
                <span class="badge" id="cart-count">0</span>
            </h1>
            <a href="/products/" class="continue-shopping">
                <i class="fas fa-arrow-left"></i> Continue Shopping
            </a>
        </div>

        <!-- Loader -->
        <div id="loader" class="loader">
            <div class="spinner"></div>
            <span>Loading your cart...</span>
        </div>

        <!-- Cart Grid -->
        <div id="cart-grid" class="cart-grid" style="display:none;">

            <!-- Cart Items -->
            <div class="cart-items-list" id="cart-items-list">
                <!-- Cart items will be rendered here -->
            </div>

            <!-- Cart Summary Sidebar -->
            <div class="cart-summary-sidebar" id="cart-summary">
                <h3>Order Summary</h3>

                <div class="summary-row">
                    <span class="label">Subtotal</span>
                    <span class="value" id="subtotal">৳0.00</span>
                </div>

                <div class="summary-row">
                    <span class="label">Shipping</span>
                    <span class="value" id="shipping">৳0.00</span>
                </div>

                <div class="summary-row">
                    <span class="label">Total Items</span>
                    <span class="value" id="total-items">0</span>
                </div>

                <div class="summary-row total">
                    <span class="label">Total</span>
                    <span class="amount" id="total-amount">৳0.00</span>
                </div>

                <button class="btn-checkout" id="btn-checkout" onclick="goToCheckout()">
                    <i class="fas fa-lock"></i> Proceed to Checkout
                </button>

                <button class="btn-clear-cart" onclick="clearCart()">
                    <i class="fas fa-trash-alt"></i> Clear Cart
                </button>
            </div>

        </div>

    </div>

    <!-- ============================================
    SCRIPTS
    ============================================ -->
    <script>
        // ============================================
        // CONFIG
        // ============================================
        const API_BASE = '/api';

        // ============================================
        // CSRF TOKEN
        // ============================================
        function getCookie(name) {
            let value = null;
            if (document.cookie && document.cookie !== '') {
                document.cookie.split(';').forEach(c => {
                    const trimmed = c.trim();
                    if (trimmed.startsWith(name + '=')) {
                        value = decodeURIComponent(trimmed.substring(name.length + 1));
                    }
                });
            }
            return value;
        }

        // ============================================
        // NOTIFICATION
        // ============================================
        function showNotification(message, type = 'info') {
            const colors = {
                success: '#22c55e',
                error: '#dc2626',
                info: '#3b82f6',
                warning: '#f59e0b'
            };
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.style.background = colors[type] || colors.info;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transition = 'opacity 0.4s ease';
                setTimeout(() => notification.remove(), 400);
            }, 3000);
        }

        // ============================================
        // LOAD CART
        // ============================================
        async function loadCart() {
            const loader = document.getElementById('loader');
            const grid = document.getElementById('cart-grid');
            const container = document.getElementById('cart-items-list');

            loader.style.display = 'flex';
            grid.style.display = 'none';

            try {
                const response = await fetch('/api/cart/');
                const data = await response.json();

                console.log('📦 Cart Data:', data);

                if (!data.success || !data.data || !data.data.items || data.data.items.length === 0) {
                    container.innerHTML = `
                        <div class="empty-cart">
                            <div class="icon">🛒</div>
                            <h3>Your cart is empty</h3>
                            <p>Looks like you haven't added any items to your cart yet.</p>
                            <a href="/products/" class="btn-shop">
                                <i class="fas fa-shopping-bag"></i> Start Shopping
                            </a>
                        </div>
                    `;
                    updateSummary(null);
                    loader.style.display = 'none';
                    grid.style.display = 'block';
                    return;
                }

                renderCartItems(data.data);
                updateSummary(data.data);

                loader.style.display = 'none';
                grid.style.display = 'block';

            } catch (error) {
                console.error('❌ Error loading cart:', error);
                container.innerHTML = `
                    <div class="empty-cart">
                        <div class="icon">⚠️</div>
                        <h3>Something went wrong</h3>
                        <p>Failed to load your cart. Please try again.</p>
                        <button onclick="loadCart()" class="btn-shop" style="background:#6366f1; color:#fff; border:none; padding:12px 32px; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer;">
                            <i class="fas fa-sync"></i> Retry
                        </button>
                    </div>
                `;
                loader.style.display = 'none';
                grid.style.display = 'block';
            }
        }

        // ============================================
        // RENDER CART ITEMS
        // ============================================
        function renderCartItems(cart) {
            const container = document.getElementById('cart-items-list');

            let html = '';

            cart.items.forEach(item => {
                // ✅ Image URL - complete URL
                let imageUrl = item.image || '';
                if (imageUrl && !imageUrl.startsWith('http')) {
                    imageUrl = window.location.origin + '/media/' + imageUrl;
                }
                if (!imageUrl) {
                    imageUrl = 'https://via.placeholder.com/80x80?text=No+Image';
                }

                const subtotal = item.product_price * item.quantity;

                html += `
                    <div class="cart-item" id="cart-item-${item.product}">
                        <img src="${imageUrl}" 
                             alt="${item.product_name}" 
                             class="item-image"
                             onerror="this.src='https://via.placeholder.com/80x80?text=No+Image'">

                        <div class="item-details">
                            <div class="item-name">${item.product_name}</div>
                            <div class="item-sku">SKU: ${item.product_sku || 'N/A'}</div>
                            <div class="item-price">৳${parseFloat(item.product_price).toFixed(2)}</div>
                        </div>

                        <div class="item-actions">
                            <div class="qty-control">
                                <button onclick="updateQuantity('${item.product}', ${item.quantity - 1})">
                                    <i class="fas fa-minus"></i>
                                </button>
                                <span class="qty-value">${item.quantity}</span>
                                <button onclick="updateQuantity('${item.product}', ${item.quantity + 1})">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                            <span class="item-total">৳${parseFloat(subtotal).toFixed(2)}</span>
                            <button class="btn-remove" onclick="removeFromCart('${item.product}')">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ============================================
        // UPDATE SUMMARY
        // ============================================
        function updateSummary(cart) {
            const countEl = document.getElementById('cart-count');
            const subtotalEl = document.getElementById('subtotal');
            const shippingEl = document.getElementById('shipping');
            const totalItemsEl = document.getElementById('total-items');
            const totalAmountEl = document.getElementById('total-amount');
            const checkoutBtn = document.getElementById('btn-checkout');

            if (!cart || !cart.items || cart.items.length === 0) {
                countEl.textContent = '0';
                subtotalEl.textContent = '৳0.00';
                shippingEl.textContent = '৳0.00';
                totalItemsEl.textContent = '0';
                totalAmountEl.textContent = '৳0.00';
                checkoutBtn.disabled = true;
                return;
            }

            const totalItems = cart.total_items || 0;
            const subtotal = cart.total_price || 0;
            const shipping = totalItems > 0 ? 100 : 0;
            const total = subtotal + shipping;

            countEl.textContent = totalItems;
            subtotalEl.textContent = `৳${parseFloat(subtotal).toFixed(2)}`;
            shippingEl.textContent = shipping > 0 ? `৳${shipping.toFixed(2)}` : 'Free';
            totalItemsEl.textContent = totalItems;
            totalAmountEl.textContent = `৳${parseFloat(total).toFixed(2)}`;
            checkoutBtn.disabled = false;
        }

        // ============================================
        // UPDATE QUANTITY
        // ============================================
        async function updateQuantity(productId, quantity) {
            if (quantity < 0) return;

            try {
                const response = await fetch('/api/cart/', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ product_id: productId, quantity: quantity })
                });

                const data = await response.json();

                if (data.success) {
                    loadCart();
                } else {
                    showNotification(data.message || 'Failed to update quantity', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('Network error. Please try again.', 'error');
            }
        }

        // ============================================
        // REMOVE FROM CART
        // ============================================
        async function removeFromCart(productId) {
            if (!confirm('Remove this item from cart?')) return;

            try {
                const response = await fetch('/api/cart/', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ product_id: productId })
                });

                const data = await response.json();

                if (data.success) {
                    showNotification('Item removed from cart', 'info');
                    loadCart();
                } else {
                    showNotification(data.message || 'Failed to remove item', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('Network error. Please try again.', 'error');
            }
        }

        // ============================================
        // CLEAR CART
        // ============================================
        async function clearCart() {
            if (!confirm('Clear your entire cart?')) return;

            try {
                const response = await fetch('/api/cart/clear/', {
                    method: 'POST',
                    headers: { 'X-CSRFToken': getCookie('csrftoken') }
                });

                const data = await response.json();

                if (data.success) {
                    showNotification('Cart cleared!', 'info');
                    loadCart();
                } else {
                    showNotification(data.message || 'Failed to clear cart', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showNotification('Network error. Please try again.', 'error');
            }
        }

        // ============================================
        // GO TO CHECKOUT
        // ============================================
        function goToCheckout() {
            window.location.href = '/payment/checkout/';
        }

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            loadCart();
        });
    </script>

</body>
</html>
