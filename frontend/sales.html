<!-- templates/reports/sales.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales Report – Inventory System</title>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>

    <style>
        /* ============================================
           RESET & BASE
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            padding: 20px;
        }

        /* ============================================
           HEADER
           ============================================ */
        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            padding: 20px 30px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .header h1 span {
            color: #fbbf24;
        }

        .header .actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .header .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .header .btn-back {
            background: #3b82f6;
            color: #fff;
        }

        .header .btn-back:hover {
            background: #2563eb;
        }

        .header .btn-logout {
            background: #ef4444;
            color: #fff;
        }

        .header .btn-logout:hover {
            background: #dc2626;
        }

        .header .last-updated {
            font-size: 13px;
            opacity: 0.7;
        }

        /* ============================================
           FILTERS
           ============================================ */
        .filters {
            background: #ffffff;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .filters .label {
            font-weight: 600;
            color: #1e293b;
            font-size: 14px;
        }

        .filters .btn-filter {
            padding: 8px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: #ffffff;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            color: #475569;
        }

        .filters .btn-filter:hover {
            border-color: #3b82f6;
            color: #3b82f6;
        }

        .filters .btn-filter.active {
            background: #3b82f6;
            color: #ffffff;
            border-color: #3b82f6;
        }

        .filters .report-label {
            margin-left: auto;
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
            background: #f1f5f9;
            padding: 6px 16px;
            border-radius: 20px;
        }

        /* ============================================
           STATS GRID
           ============================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: 700;
            color: #0f172a;
        }

        .stat-card .label {
            font-size: 14px;
            color: #64748b;
            font-weight: 600;
            margin-top: 4px;
        }

        .stat-card.blue .number {
            color: #3b82f6;
        }
        .stat-card.green .number {
            color: #22c55e;
        }
        .stat-card.purple .number {
            color: #8b5cf6;
        }
        .stat-card.orange .number {
            color: #f59e0b;
        }

        /* ============================================
           CHART & TABLE ROW
           ============================================ */
        .row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .card h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card h3 .badge {
            background: #3b82f6;
            color: #fff;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .card h3 .badge.green {
            background: #22c55e;
        }

        .chart-container {
            position: relative;
            height: 280px;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* ============================================
           TABLE
           ============================================ */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            text-align: left;
            padding: 10px 12px;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid #f1f5f9;
        }

        tr:hover td {
            background: #f8fafc;
        }

        .rank {
            font-weight: 700;
            color: #94a3b8;
        }

        .product-name {
            font-weight: 600;
            color: #0f172a;
        }

        .product-sku {
            font-size: 12px;
            color: #94a3b8;
        }

        .text-center {
            text-align: center;
            color: #94a3b8;
        }

        /* ============================================
           LOADER
           ============================================ */
        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 50vh;
            color: #94a3b8;
            font-size: 18px;
        }

        .loader .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        .error-box {
            background: #fee2e2;
            border-left: 4px solid #dc2626;
            padding: 16px 20px;
            border-radius: 8px;
            color: #991b1b;
            margin: 20px 0;
        }

        .error-box .btn-retry {
            padding: 8px 16px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: 600;
        }

        .error-box .btn-retry:hover {
            background: #2563eb;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 992px) {
            .row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .header .actions {
                justify-content: center;
            }

            .filters {
                flex-direction: column;
                align-items: stretch;
            }

            .filters .report-label {
                margin-left: 0;
                text-align: center;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .stat-card .number {
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .filters .btn-filter {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================
    HEADER
    ============================================ -->
    <header class="header">
        <div>
            <h1>📊 <span>Sales</span> Report</h1>
            <div class="last-updated" id="last-updated">Loading...</div>
        </div>
        <div class="actions">
            <a href="/dashboard/" class="btn btn-back">← Dashboard</a>
            <button class="btn btn-logout" onclick="logout()">🚪 Logout</button>
        </div>
    </header>

    <!-- ============================================
    FILTERS
    ============================================ -->
    <div class="filters">
        <span class="label">📅 Report Type:</span>
        <button class="btn-filter active" data-type="daily">📆 Daily</button>
        <button class="btn-filter" data-type="weekly">📊 Weekly</button>
        <button class="btn-filter" data-type="monthly">📈 Monthly</button>
        <button class="btn-filter" data-type="yearly">📉 Yearly</button>
        <span class="report-label" id="report-label">Daily Report</span>
    </div>

    <!-- ============================================
    LOADER
    ============================================ -->
    <div id="loader" class="loader">
        <div class="spinner"></div>
        Loading Sales Report...
    </div>

    <!-- ============================================
    MAIN CONTENT
    ============================================ -->
    <div id="main-content" class="hidden">

        <!-- STATS CARDS -->
        <div class="stats-grid" id="stats-grid">
            <div class="stat-card blue">
                <div class="number" id="total-sales">0</div>
                <div class="label">📦 Total Orders</div>
            </div>
            <div class="stat-card green">
                <div class="number" id="total-revenue">$0</div>
                <div class="label">💰 Total Revenue</div>
            </div>
            <div class="stat-card purple">
                <div class="number" id="avg-order">$0</div>
                <div class="label">📊 Avg Order Value</div>
            </div>
        </div>

        <!-- CHART + TOP PRODUCTS -->
        <div class="row">
            <!-- Chart -->
            <div class="card">
                <h3>📈 Revenue & Orders Trend</h3>
                <div class="chart-container">
                    <canvas id="trend-chart"></canvas>
                </div>
            </div>

            <!-- Top Products -->
            <div class="card">
                <h3>🏆 Top Products <span class="badge green">By Revenue</span></h3>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Product</th>
                                <th>Qty</th>
                                <th>Revenue</th>
                            </tr>
                        </thead>
                        <tbody id="top-products-body">
                            <tr><td colspan="4" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- DAILY BREAKDOWN -->
        <div class="card">
            <h3>📅 Daily Breakdown</h3>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Orders</th>
                            <th>Revenue</th>
                        </tr>
                    </thead>
                    <tbody id="daily-breakdown-body">
                        <tr><td colspan="3" class="text-center">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // ============================================
        // CONFIG
        // ============================================
        const API_BASE = '/api/reports';
        const TOKEN = localStorage.getItem('access_token') || '';

        let currentType = 'daily';
        let trendChartInstance = null;

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        function formatCurrency(value) {
            return '$' + Number(value).toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
        }

        // ============================================
        // LOGOUT
        // ============================================
        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('username');
            window.location.href = '/login/';
        }

        // ============================================
        // FETCH SALES REPORT
        // ============================================
        async function fetchSalesReport(type) {
            const loader = document.getElementById('loader');
            const main = document.getElementById('main-content');

            loader.classList.remove('hidden');
            main.classList.add('hidden');

            try {
                const url = `${API_BASE}/sales/?type=${type}`;
                console.log('📊 Fetching:', url);

                const headers = {
                    'Content-Type': 'application/json'
                };

                if (TOKEN) {
                    headers['Authorization'] = `Bearer ${TOKEN}`;
                }

                const res = await fetch(url, { headers: headers });

                if (!res.ok) {
                    const errorText = await res.text();
                    console.error('❌ Error response:', errorText);
                    throw new Error(`HTTP ${res.status}: ${res.statusText}`);
                }

                const json = await res.json();
                console.log('✅ Response:', json);

                if (!json.success) {
                    throw new Error(json.message || 'Failed to load data');
                }

                const data = json.data;

                // Update UI
                document.getElementById('report-label').textContent = data.label || 'Report';
                document.getElementById('last-updated').textContent =
                    `🔄 Last updated: ${new Date().toLocaleString()}`;

                // Render Stats
                document.getElementById('total-sales').textContent = data.total_sales || 0;
                document.getElementById('total-revenue').textContent = formatCurrency(data.total_revenue || 0);
                document.getElementById('avg-order').textContent = formatCurrency(data.average_order_value || 0);

                // Render Chart
                renderChart(data.daily_breakdown || []);

                // Render Top Products
                renderTopProducts(data.top_products || []);

                // Render Daily Breakdown
                renderDailyBreakdown(data.daily_breakdown || []);

                // Show content
                loader.classList.add('hidden');
                main.classList.remove('hidden');

            } catch (err) {
                console.error('❌ Fetch Error:', err);
                loader.innerHTML = `
                    <div class="error-box">
                        ❌ Failed to load sales report: ${err.message}
                        <br><br>
                        <button class="btn-retry" onclick="fetchSalesReport('${type}')">
                            🔄 Retry
                        </button>
                    </div>
                `;
            }
        }

        // ============================================
        // RENDER CHART
        // ============================================
        function renderChart(dailyData) {
            const labels = dailyData.map(d => d.date);
            const orders = dailyData.map(d => d.orders);
            const revenue = dailyData.map(d => d.revenue);

            const ctx = document.getElementById('trend-chart').getContext('2d');

            if (trendChartInstance) {
                trendChartInstance.destroy();
            }

            if (labels.length === 0) {
                // Show empty state
                return;
            }

            trendChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '📦 Orders',
                        data: orders,
                        backgroundColor: 'rgba(59, 130, 246, 0.6)',
                        borderColor: 'rgba(59, 130, 246, 1)',
                        borderWidth: 2,
                        borderRadius: 4,
                        order: 1,
                        yAxisID: 'y',
                    }, {
                        label: '💰 Revenue ($)',
                        data: revenue,
                        type: 'line',
                        borderColor: 'rgba(34, 197, 94, 1)',
                        backgroundColor: 'rgba(34, 197, 94, 0.1)',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 5,
                        pointBackgroundColor: 'rgba(34, 197, 94, 1)',
                        order: 0,
                        yAxisID: 'y1',
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                usePointStyle: true,
                                padding: 20,
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    let value = context.raw || 0;
                                    if (context.dataset.label.includes('Revenue')) {
                                        return label + ': ' + formatCurrency(value);
                                    }
                                    return label + ': ' + value;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            position: 'left',
                            title: {
                                display: true,
                                text: '📦 Orders',
                                color: '#64748b',
                            },
                            grid: {
                                color: 'rgba(0,0,0,0.05)'
                            }
                        },
                        y1: {
                            beginAtZero: true,
                            position: 'right',
                            title: {
                                display: true,
                                text: '💰 Revenue ($)',
                                color: '#64748b',
                            },
                            grid: {
                                drawOnChartArea: false,
                            },
                        }
                    }
                }
            });
        }

        // ============================================
        // RENDER TOP PRODUCTS
        // ============================================
        function renderTopProducts(products) {
            const tbody = document.getElementById('top-products-body');

            if (!products || products.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="4" class="text-center">No products sold</td></tr>`;
                return;
            }

            tbody.innerHTML = products.map((p, i) => `
                <tr>
                    <td class="rank">#${i + 1}</td>
                    <td>
                        <div class="product-name">${p.name || 'N/A'}</div>
                        <div class="product-sku">${p.sku || ''}</div>
                    </td>
                    <td>${p.total_quantity || 0}</td>
                    <td>${formatCurrency(p.total_revenue || 0)}</td>
                </tr>
            `).join('');
        }

        // ============================================
        // RENDER DAILY BREAKDOWN
        // ============================================
        function renderDailyBreakdown(data) {
            const tbody = document.getElementById('daily-breakdown-body');

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center">No data available</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(d => `
                <tr>
                    <td>${formatDate(d.date)}</td>
                    <td><strong>${d.orders || 0}</strong></td>
                    <td>${formatCurrency(d.revenue || 0)}</td>
                </tr>
            `).join('');
        }

        // ============================================
        // FILTER BUTTONS
        // ============================================
        document.querySelectorAll('.btn-filter').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                currentType = this.dataset.type;
                fetchSalesReport(currentType);
            });
        });

        // ============================================
        // AUTO REFRESH (every 2 minutes)
        // ============================================
        let refreshInterval = setInterval(() => {
            if (!document.hidden) {
                fetchSalesReport(currentType);
            }
        }, 120000);

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            fetchSalesReport('daily');
        });

        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>

</body>
</html>
